<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi-hole</title>
<style>
:root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --text:#1c1f26; --muted:#666e7a; --line:#e2e5ea; --accent:#c4111b; --ok:#1a7f37; --bad:#c93a3a; --warn:#b35a0a; --soft:#c4111b1a; }
@media (prefers-color-scheme: dark) { :root { --bg:#15171c; --card:#1f2229; --text:#eceef2; --muted:#9aa2ad; --line:#30343c; --accent:#ef5a5f; --ok:#44b866; --bad:#ec6a6a; --warn:#dd9140; --soft:#ef5a5f26; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
header { padding:18px 16px 0; max-width:900px; margin:auto; }
h1 { font-size:24px; margin:0 0 10px; }
nav { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
nav button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 10px; color:var(--muted); }
nav button.on { color:var(--text); border-color:var(--accent); font-weight:620; }
main { max-width:900px; margin:auto; padding:8px 16px 48px; }
h2 { font-size:13px; color:var(--muted); margin:20px 0 8px; font-weight:650; }
button { font:inherit; border:1px solid var(--line); background:var(--card); color:inherit; border-radius:9px; padding:7px 13px; cursor:pointer; }
button.main { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button.danger { color:var(--bad); }
button:disabled { opacity:.55; cursor:default; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.click { cursor:pointer; }
.name { font-weight:620; }
.quiet { color:var(--muted); font-size:13px; }
.bad { color:var(--bad); } .warn { color:var(--warn); } .ok { color:var(--ok); }
.note { background:var(--soft); border-color:transparent; }
.pills { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
.pill { font-size:12px; border-radius:20px; padding:1px 8px; background:var(--soft); white-space:nowrap; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; align-items:center; }
dialog { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; width:min(560px,94vw); padding:18px; }
dialog::backdrop { background:#0007; }
label { display:block; margin:9px 0 3px; font-size:13px; color:var(--muted); }
label.check { color:inherit; font-size:15px; margin:6px 0; display:flex; align-items:center; gap:8px; }
input { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
input[type=checkbox] { width:auto; margin:0; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
.err { color:var(--bad); margin:8px 0; white-space:pre-wrap; }
.hint { font-size:12.5px; color:var(--muted); margin:3px 0 0; }
.foot { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap; }
.link { overflow-wrap:anywhere; font-family:ui-monospace,monospace; font-size:13px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
@media (max-width:560px) { .two { grid-template-columns:1fr; } }
.big { font-size:22px; font-weight:680; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
.stats .card { margin:0; }
.row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; }
.row span:first-child { overflow-wrap:anywhere; }
.bar { display:flex; align-items:flex-end; gap:1px; height:90px; margin-top:6px; }
.bar div { flex:1; background:var(--line); position:relative; min-height:1px; border-radius:2px 2px 0 0; }
.bar div i { position:absolute; left:0; right:0; bottom:0; background:var(--accent); border-radius:2px 2px 0 0; }
.inst { display:grid; grid-template-columns:2fr 3fr auto; gap:8px; align-items:end; }
@media (max-width:560px) { .inst { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Pi-hole</h1>
  <nav id="nav"></nav>
</header>
<main id="app">Wird geladen …</main>

<script>
const $ = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids.filter(k => k != null)); return e; };
const app = document.getElementById("app"), nav = document.getElementById("nav");
const PAUSES = [[30, "30 Sekunden"], [300, "5 Minuten"], [1800, "30 Minuten"], [3600, "1 Stunde"]];
let tab = "overview", manager = false, timer = null;
const num = n => Number(n || 0).toLocaleString("de-DE");
const time = t => new Date(t * 1000).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.detail || `Fehler ${r.status}`);
  return out;
}

function drawNav() {
  const tabs = [["overview", "Übersicht"], ["stats", "Statistik"], ...(manager ? [["settings", "Einstellungen"]] : [])];
  nav.replaceChildren(...tabs.map(([id, label]) => $("button", { textContent: label, className: id === tab ? "on" : "", onclick: () => { tab = id; show(); } })));
}

const err = text => $("p", { className: "err", textContent: text });
const needSetup = () => $("div", { className: "card note" }, "Es ist noch kein Pi-hole eingetragen. ",
  manager ? $("a", { href: "#", textContent: "Jetzt unter Einstellungen eintragen.", onclick: e => { e.preventDefault(); tab = "settings"; show(); } }) : "Das kann ein Admin unter Einstellungen.");

async function show() {
  clearTimeout(timer);
  let o;
  try { o = await api("api/overview"); manager = o.manager; } catch (e) { drawNav(); app.replaceChildren(err(e.message)); return; }
  drawNav();
  if (tab === "settings") return showSettings();
  if (!o.configured) return app.replaceChildren(needSetup());
  if (tab === "stats") return showStats();
  showOverview(o);
}

function stateText(o) {
  const paused = o.instances.filter(i => i.online && i.blocking === "disabled");
  const until = paused.map(i => i.timer).filter(t => t);
  if (o.blocking === "enabled") return ["Werbefilter an", "ok"];
  if (o.blocking === "disabled") return [until.length ? `Pausiert, noch ${Math.ceil(Math.max(...until) / 60)} min` : "Pausiert ohne Ende", "warn"];
  if (o.blocking === "mixed") return ["Nicht überall gleich", "warn"];
  return ["Kein Pi-hole erreichbar", "bad"];
}

function showOverview(o) {
  const [text, cls] = stateText(o);
  const msg = $("p", { className: "quiet" });
  const run = async (path, body) => {
    try {
      const r = await api(path, "POST", body);
      const bad = r.instances.filter(i => !i.ok);
      await show();
      if (bad.length) app.prepend(err(bad.map(i => i.error).join("\n")));
    } catch (e) { msg.textContent = e.message; }
  };
  const buttons = o.blocking === "enabled" ? [] : [$("button", { className: "main", textContent: "Wieder einschalten", onclick: () => run("api/resume") })];
  PAUSES.forEach(([s, label]) => buttons.push($("button", { textContent: label, onclick: () => run("api/pause", { seconds: s }) })));
  if (manager) buttons.push($("button", { className: "danger", textContent: "Ohne Ende", onclick: () => confirm("Werbefilter ohne Ende pausieren? Er bleibt dann aus, bis jemand ihn wieder einschaltet.") && run("api/pause", {}) }));
  const rows = o.instances.map((i, n) => $("div", { className: "card click", onclick: () => showDetail(n) },
    $("div", { className: "name" }, i.name, $("span", { className: "quiet", textContent: ` · ${i.url.replace(/^https?:\/\//, "")}` })),
    i.online ? $("div", { className: i.blocking === "enabled" ? "ok" : "warn",
      textContent: (i.blocking === "enabled" ? "Filter an" : i.timer ? `Pausiert, noch ${Math.ceil(i.timer / 60)} min` : "Pausiert") + ((i.version || i.ftl) ? ` · Pi-hole ${i.version || "FTL " + i.ftl}` : "") + " ›" })
      : $("div", { className: "bad", textContent: i.error }),
    (i.updates || []).length ? $("div", { className: "quiet", textContent: "Update verfügbar: " + i.updates.map(u => `${u.part} ${u.available}`).join(", ") + " (auf dem Gerät mit „pihole -up“)" }) : null));
  app.replaceChildren(
    $("div", { className: "card" }, $("div", { className: `big ${cls}`, textContent: text }),
      $("p", { className: "hint", textContent: "Pausieren gilt für alle Pi-holes gleichzeitig. Danach schalten sie sich von selbst wieder ein." }),
      $("div", { className: "actions" }, ...buttons), msg),
    $("h2", { textContent: "Pi-holes" }), ...rows);
  if (o.blocking !== "enabled") timer = setTimeout(show, 15000);
}

const bytes = b => b >= 1073741824 ? `${(b / 1073741824).toLocaleString("de-DE", { maximumFractionDigits: 1 })} GB` : `${Math.round(b / 1048576)} MB`;
function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} Tg. ${h} Std.` : h ? `${h} Std. ${m} Min.` : `${m} Min.`;
}

async function showDetail(n) {
  clearTimeout(timer);
  app.replaceChildren($("p", { className: "quiet", textContent: "Wird geladen …" }));
  let d;
  try { d = await api(`api/instances/${n}`); } catch (e) { app.replaceChildren(backLink(), err(e.message)); return; }
  const row = (label, value) => value === "" || value == null ? null : $("div", { className: "row" }, $("span", { className: "quiet", textContent: label }), $("span", { textContent: value }));
  const dev = d.device, q = d.queries;
  const temp = dev.temp == null ? "" : `${Number(dev.temp).toLocaleString("de-DE", { maximumFractionDigits: 1 })} °C`;
  app.replaceChildren(backLink(),
    $("div", { className: "card" }, $("div", { className: "big", textContent: d.name }),
      $("div", { className: d.blocking === "enabled" ? "ok" : "warn", textContent: d.blocking === "enabled" ? "Filter an" : d.timer ? `Pausiert, noch ${Math.ceil(d.timer / 60)} min` : "Pausiert" }),
      $("div", { className: "quiet", textContent: d.url })),
    $("h2", { textContent: "Heute (24 h)" }),
    $("div", { className: "card" }, row("Anfragen", num(q.total)), row("Geblockt", `${num(q.blocked)} (${d.percent.toLocaleString("de-DE")} %)`),
      row("Aus dem Zwischenspeicher", num(q.cached)), row("Weitergeleitet", num(q.forwarded)), row("Verschiedene Domains", num(q.unique_domains)), row("Aktive Geräte", num(d.clients))),
    $("h2", { textContent: "Blocklisten" }),
    $("div", { className: "card" }, row("Domains auf den Listen", num(d.gravity)), row("Listen", d.lists ? num(d.lists) : ""),
      row("Eigene Ausnahmen", num(d.own_allowed)), row("Eigene Sperren", num(d.own_denied)), row("Stand", d.gravity_update ? time(d.gravity_update) : "")),
    $("h2", { textContent: "Version" }),
    $("div", { className: "card" }, ...d.versions.map(v => row(v.part, v.installed)),
      d.updates.length ? $("div", { className: "warn", textContent: "Update verfügbar: " + d.updates.map(u => `${u.part} ${u.available}`).join(", ") + " (auf dem Gerät mit „pihole -up“)" }) : $("div", { className: "quiet", textContent: "Aktuell" })),
    $("h2", { textContent: "Gerät" }),
    $("div", { className: "card" }, row("Modell", dev.model), row("Name", dev.hostname), row("System", dev.os),
      row("Gerät läuft seit", dev.uptime ? duration(dev.uptime) : ""), row("Pi-hole läuft seit", dev.ftl_uptime ? duration(dev.ftl_uptime) : ""), row("Temperatur", temp),
      row("Prozessor", dev.cpus ? `${dev.cpus} Kerne, Last ${dev.load.map(x => x.toLocaleString("de-DE")).join(" / ")}` : ""),
      row("Arbeitsspeicher", dev.ram_total ? `${bytes(dev.ram_used)} von ${bytes(dev.ram_total)} belegt` : "")),
    d.messages.length ? $("h2", { textContent: "Hinweise von Pi-hole" }) : null,
    ...d.messages.map(m => $("div", { className: "card note", textContent: m })));
}

const backLink = () => $("p", {}, $("a", { href: "#", textContent: "‹ Alle Pi-holes", onclick: e => { e.preventDefault(); show(); } }));

function list(title, items, label) {
  return $("div", { className: "card" }, $("div", { className: "name", textContent: title }),
    ...(items.length ? items.map(x => $("div", { className: "row" }, $("span", { textContent: label(x) }), $("span", { className: "quiet", textContent: num(x.count) }))) : [$("div", { className: "quiet", textContent: "Noch nichts" })]));
}

async function showStats() {
  let s;
  try { s = await api("api/stats"); } catch (e) { app.replaceChildren(err(e.message)); return; }
  const tile = (label, value, detail) => $("div", { className: "card" }, $("div", { className: "quiet", textContent: label }), $("div", { className: "big", textContent: value }), detail ? $("div", { className: "quiet", textContent: detail }) : null);
  const max = Math.max(1, ...s.history.map(h => h.total));
  const bars = $("div", { className: "bar" }, ...s.history.map(h => {
    const d = $("div", { title: `${time(h.time)}: ${num(h.total)} Anfragen, ${num(h.blocked)} geblockt`, style: `height:${100 * h.total / max}%` });
    d.append($("i", { style: `height:${h.total ? 100 * h.blocked / h.total : 0}%` })); return d;
  }));
  app.replaceChildren(
    ...s.errors.map(e => err(e.error)),
    $("div", { className: "stats" },
      tile("Anfragen (24 h)", num(s.total), `${num(s.clients_active)} Geräte aktiv`),
      tile("Geblockt", num(s.blocked), `${s.percent.toLocaleString("de-DE")} %`),
      tile("Blockliste", num(s.gravity), s.gravity_update ? `Stand ${time(s.gravity_update)}` : "")),
    $("div", { className: "card" }, $("div", { className: "name", textContent: "Verlauf (24 h)" }), bars,
      $("div", { className: "hint", textContent: "Grau: alle Anfragen, rot: davon geblockt" })),
    list("Am häufigsten geblockt", s.top_blocked, x => x.domain),
    list("Häufigste Geräte", s.top_clients, x => x.name || x.ip),
    list("Am häufigsten erlaubt", s.top_permitted, x => x.domain),
    $("p", { className: "hint", textContent: `Zusammengezählt aus ${s.answered} von ${s.instances} Pi-holes.` }));
}

async function showSettings() {
  let s;
  try { s = await api("api/settings"); } catch (e) { app.replaceChildren(err(e.message)); return; }
  const box = $("div");
  const msg = $("p", { className: "quiet" });
  const add = (item = { name: "", url: "", password_set: false }) => {
    const name = $("input", { value: item.name, placeholder: "z. B. Küche" });
    const url = $("input", { value: item.url, placeholder: "http://192.168.1.2" });
    const pw = $("input", { type: "password", placeholder: item.password_set ? "gespeichert – leer lassen zum Behalten" : "leer, wenn keins gesetzt" });
    const row = $("div", { className: "card" },
      $("div", { className: "inst" }, $("div", {}, $("label", { textContent: "Name" }), name), $("div", {}, $("label", { textContent: "Adresse" }), url),
        $("button", { className: "danger", textContent: "Entfernen", onclick: () => row.remove() })),
      $("label", { textContent: "Passwort (oder App-Passwort)" }), pw);
    row.read = () => ({ name: name.value, url: url.value, ...(pw.value || !item.password_set || url.value.replace(/\/+$/, "") !== item.url ? { password: pw.value } : {}) });
    box.append(row);
  };
  s.instances.forEach(add);
  if (!s.instances.length) add();
  app.replaceChildren(
    $("p", { className: "hint", textContent: "Alle Pi-holes, die zusammen dein Netz versorgen. Pausieren geht an alle, die Statistik zählt sie zusammen. Nötig ist Pi-hole 6. Am besten in Pi-hole unter Einstellungen → Web-Oberfläche/API ein App-Passwort erzeugen und hier eintragen; es bleibt nur auf dem Server." }),
    box,
    $("div", { className: "foot" }, $("button", { textContent: "Pi-hole hinzufügen", onclick: () => add() }),
      $("button", { className: "main", textContent: "Speichern", onclick: async () => {
        try { await api("api/settings", "PUT", { instances: [...box.children].map(r => r.read()) }); msg.textContent = "Gespeichert."; showSettings(); }
        catch (e) { msg.textContent = e.message; }
      } })), msg);
}

show();
</script>
</body>
</html>
