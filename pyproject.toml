[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "networkmonitor"
version = "0.1.0"
description = "Überwacht das Heimnetz, erkennt neue Geräte und lässt sie erlauben oder sperren."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "fritzconnection>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
networkmonitor = "networkmonitor.main:run"
networkmonitor-probe = "networkmonitor.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
networkmonitor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
