name: Screenshots

# Nimmt die Bilder fürs README im Emulator auf, mit erfundenen Beispieldaten. Die Bilder landen in docs/screenshots auf dem Zweig.
on:
  push:
    branches-ignore: [main]
    paths:
      - "tools/app_screenshots.py"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - run: pip install cryptography
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 tools/app_screenshots.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots/
            probe/
      - name: Bilder auf den Zweig legen
        if: success() && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Screenshots aus dem Emulator"
          git push origin HEAD:${GITHUB_REF_NAME}
